name: Release

# Runs when a tag like v4.2.1 is pushed (or a release is created on github.com with a new tag).
# The exe is built on GitHub's runners (not on a personal PC), launch-tested, hashed and attested,
# then attached to the release. The attestation proves WHERE and FROM WHICH commit the file was
# built; PyInstaller output is not bit-for-bit reproducible, so a self-built exe has a different hash.
#
# Two jobs on purpose: "build" runs the project's code and dependencies with read-only access;
# "publish" has the write permissions but only handles the finished file.
# Actions are pinned to commit SHAs; Python dependencies come from requirements-lock.txt (hash-checked).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - name: Install dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Check the tag matches APP_VERSION
        shell: python
        run: |
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          src = open("clickwave/common.py", encoding="utf-8").read()
          version = re.search(r'^APP_VERSION\s*=\s*"([0-9.]+)"', src, re.M).group(1)
          if tag != version:
              sys.exit(f"Tag v{tag} does not match APP_VERSION {version} in clickwave/common.py")
      - name: Lint and test
        run: |
          python -m pyflakes clickwave tests tools
          python -m unittest discover -s tests -t . -v
      - name: Build
        run: python -m PyInstaller --noconfirm Clickwave.spec
      - name: Launch the built exe (hidden window, throwaway APPDATA)
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "selftest-appdata"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $p = Start-Process dist\Clickwave.exe -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:APPDATA\Clickwave\clickwave.log" -ErrorAction SilentlyContinue
            throw "Clickwave.exe --selftest failed (exit code $($p.ExitCode))"
          }
          "Selftest OK"
      - name: SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Clickwave.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Clickwave.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-files
          path: |
            dist/Clickwave.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release / upload assets
      id-token: write        # sign the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-files
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: dist/Clickwave.exe
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Clickwave $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/Clickwave.exe dist/SHA256SUMS.txt --clobber
