name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes clickwave tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Launch smoke test (hidden window)
        run: python tests/smoke_launch.py
