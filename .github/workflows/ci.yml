name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - name: Install dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes clickwave tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Launch smoke test (hidden window)
        run: python tests/smoke_launch.py
